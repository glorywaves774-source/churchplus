# Render Blueprint for ChurchPlus. In Render: New > Blueprint > select this repository.
# One web service, three scheduled jobs, a PostgreSQL database and a Key Value store (for
# rate limits shared across workers). Secrets live in the "churchplus-shared" group:
# fill the ones marked sync:false in the Render dashboard – never in this file.

envVarGroups:
  - name: churchplus-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_APP
        value: run.py
      - key: SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY          # Fernet key; see docs/DEPLOYMENT.md
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: PUBLIC_BASE_URL               # e.g. https://app.churchplus.com.gh
        sync: false
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MAIL_BACKEND
        value: smtp
      - key: MAIL_FROM
        sync: false
      - key: MAIL_SMTP_HOST
        sync: false
      - key: MAIL_SMTP_USERNAME
        sync: false
      - key: MAIL_SMTP_PASSWORD
        sync: false
      - key: SMS_BACKEND                   # arkesel | hubtel | console
        value: arkesel
      - key: HUBTEL_SMS_CLIENT_ID
        sync: false
      - key: HUBTEL_SMS_CLIENT_SECRET
        sync: false
      - key: ARKESEL_API_KEY
        sync: false
      - key: WHATSAPP_BACKEND              # meta | console
        value: console
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: HUBTEL_PAY_CLIENT_ID
        sync: false
      - key: HUBTEL_PAY_CLIENT_SECRET
        sync: false
      - key: HUBTEL_MERCHANT_ACCOUNT
        sync: false
      - key: BILLING_GRACE_DAYS
        value: "7"

services:
  - type: web
    name: churchplus
    runtime: python
    plan: starter
    region: frankfurt          # closest Render region to West Africa
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    preDeployCommand: flask db upgrade && flask churchplus sync-permissions && flask churchplus seed-plans && flask churchplus encrypt-secrets
    startCommand: gunicorn run:app --workers 2 --threads 4 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - fromGroup: churchplus-shared
      - key: DATABASE_URL
        fromDatabase: {name: churchplus-db, property: connectionString}
      - key: RATELIMIT_STORAGE_URI
        fromService: {type: keyvalue, name: churchplus-limits, property: connectionString}
      - key: SESSION_COOKIE_SECURE
        value: "true"

  - type: cron
    name: churchplus-send-messages
    runtime: python
    region: frankfurt
    schedule: "*/5 * * * *"          # every 5 minutes: scheduled SMS / WhatsApp / email
    buildCommand: pip install -r requirements.txt
    startCommand: flask churchplus send-due
    envVars:
      - fromGroup: churchplus-shared
      - key: DATABASE_URL
        fromDatabase: {name: churchplus-db, property: connectionString}

  - type: cron
    name: churchplus-daily-reminders
    runtime: python
    region: frankfurt
    schedule: "0 7 * * *"            # 07:00 UTC = 07:00 in Ghana: birthdays and tomorrow's reminders
    buildCommand: pip install -r requirements.txt
    startCommand: flask churchplus send-reminders
    envVars:
      - fromGroup: churchplus-shared
      - key: DATABASE_URL
        fromDatabase: {name: churchplus-db, property: connectionString}

  - type: cron
    name: churchplus-billing
    runtime: python
    region: frankfurt
    schedule: "30 1 * * *"           # nightly: invoices, past-due notices, pauses
    buildCommand: pip install -r requirements.txt
    startCommand: flask churchplus billing-run
    envVars:
      - fromGroup: churchplus-shared
      - key: DATABASE_URL
        fromDatabase: {name: churchplus-db, property: connectionString}

  - type: keyvalue
    name: churchplus-limits
    plan: starter
    region: frankfurt
    ipAllowList: []                  # internal connections only
    maxmemoryPolicy: allkeys-lru

databases:
  - name: churchplus-db
    databaseName: churchplus
    user: churchplus
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
